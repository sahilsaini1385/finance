name: Tests

# Runs on every PR and every push to main. The deploy workflow builds and
# publishes; this one is the gate that says whether it should have.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build

  ui:
    name: Browser suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # playwright-core ships no browser, so fetch one with the matching CLI
      # version and hand its path to the suites via BUDGIE_CHROMIUM.
      - run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Locate Chromium
        run: echo "BUDGIE_CHROMIUM=$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -1)" >> "$GITHUB_ENV"
      - run: npm run build
      # The suites drive a built copy over HTTP, and seed.html is what several
      # of them start from.
      - name: Serve the build
        run: |
          mkdir -p site && cp -r dist/* site/
          cp tests/ui/seed.html tests/ui/smoke.pdf site/
          (cd site && python3 -m http.server 8471 &)
          for i in $(seq 1 20); do curl -sf http://localhost:8471/index.html >/dev/null && break; sleep 1; done
      - name: Run browser suites
        run: |
          fail=0
          for f in tests/ui/test-*.mjs; do
            # Needs a second build with Supabase keys baked in — not available
            # to forked PRs, and skipped rather than failed.
            case "$f" in *familysync-baked*) echo "skip $f"; continue;; esac
            echo "== $f"
            node "$f" || fail=1
          done
          exit $fail
